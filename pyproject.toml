[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synera-core"
version = "0.1.0"
description = "Trusted AI for Multi-Stressor Environmental Intelligence"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Team PeakyGliders", email = "synera@peakygliders.org" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "patsy>=0.5.4",
    "scikit-learn>=1.3.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
    "tenacity>=8.2.3",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "cryptography>=41.0.0",
    "networkx>=3.2.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.1.0",
    "shap>=0.43.0",
    "gseapy>=1.1.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlmodel>=0.0.14",
    "sse-starlette>=1.8.0",
    "python-multipart>=0.0.6",
]
notebooks = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.26.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "seaborn>=0.13.0",
    "nbformat>=5.9.0",
    "nbconvert>=7.11.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["notebooks", "frontend", "scratch"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]


[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["src", "."]

