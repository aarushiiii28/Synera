# SYNERA dataset registry (configuration). The runtime registry is synera_core.pipeline.registry.
#   id, track (A|B|C), title, source, provenance (REAL|SIMULATED), files[], design (factorial|continuous), stressors[], outcome, status
discovery: "OSD-211"      # Track A discovery study (spleen)
replication: "OSD-237"    # Track A replication tissue (skin): same animals -> CROSS_TISSUE_SAME_COHORT

datasets:
  - id: "osd-211"
    track: "A"
    title: "NASA OSDR OSD-211: spleen RNA-seq, chronic low-dose radiation x hindlimb unloading"
    source: "NASA Open Science Data Repository / GeneLab (files placed manually in data/raw/manual/osdr/OSD-211)"
    provenance: "REAL"
    files:
      - "data/raw/manual/osdr/OSD-211/GLDS-211_rna_seq_Normalized_Counts_rRNArm_GLbulkRNAseq.csv"
      - "data/raw/manual/osdr/OSD-211/OSD-211_metadata_OSD-211-ISA.zip"
      - "data/processed/osdr_OSD-211_expr.parquet"
      - "data/processed/osdr_OSD-211_meta.parquet"
    design: "factorial"
    stressors: ["ionizing_radiation", "hindlimb_unloading"]
    tissue: "Spleen"
    outcome: "log2 normalised expression (24,688 genes after the independent low-expression filter)"
    status: "INGESTED"

  - id: "osd-237"
    track: "A"
    title: "NASA OSDR OSD-237: skin RNA-seq from the same animals"
    source: "NASA Open Science Data Repository / GeneLab"
    provenance: "REAL"
    files:
      - "data/raw/manual/osdr/OSD-237/GLDS-237_rna_seq_Normalized_Counts_rRNArm_GLbulkRNAseq.csv"
      - "data/raw/manual/osdr/OSD-237/OSD-237_metadata_OSD-237-ISA.zip"
      - "data/processed/osdr_OSD-237_expr.parquet"
      - "data/processed/osdr_OSD-237_meta.parquet"
    design: "factorial"
    stressors: ["ionizing_radiation", "hindlimb_unloading"]
    tissue: "Skin"
    outcome: "log2 normalised expression (25,716 genes after the independent low-expression filter)"
    status: "INGESTED"

  - id: "env_panel"
    track: "B"
    title: "Environmental stressor panel: 8 cities x 518 days"
    source: "Open-Meteo historical weather and air-quality archives"
    provenance: "REAL"
    files: ["data/processed/env_panel.parquet"]
    design: "continuous"
    stressors: ["heat_index", "pm25", "pm10", "o3", "no2", "rh", "drought_index", "uv", "wind", "precip"]
    outcome: "none (covariates only)"
    status: "INGESTED"

  - id: "benchmark_track_b"
    track: "B"
    title: "Engine benchmark: planted interactions on the real covariates"
    source: "synera_core.benchmark.generator (deterministic; seed 20260929, SNR 2.0)"
    provenance: "SIMULATED"
    files: ["data/synthetic/benchmark_snr2.0_seed20260929.parquet"]
    design: "continuous"
    stressors: ["heat_index", "pm25", "rh", "o3", "drought_index", "pm10", "no2", "uv", "wind", "precip"]
    outcome: "simulated outcome with planted synergistic, antagonistic and non-linear interactions"
    status: "INGESTED"

  - id: "us_mortality"
    track: "C"
    title: "US weekly all-cause deaths x weather x air pollution, 46 states, 2014-2019"
    source: "CDC NCHS weekly deaths (data.cdc.gov 3yf8-kanr); US EPA AQS daily monitors; Open-Meteo/ERA5 weather; NASA POWER UV index. Built by scripts/build_health_panel.py"
    provenance: "REAL"
    files: ["data/processed/us_mortality_panel.parquet", "data/processed/us_mortality_panel_qc.json"]
    design: "continuous"
    stressors: ["heat_index", "pm25", "rh", "o3", "drought_index", "pm10", "no2", "uv", "wind", "precip"]
    outcome: "excess all-cause mortality in %, vs the state's own trend and season, minus the national value that week"
    status: "INGESTED"

  - id: "us_heart"
    track: "C"
    title: "US weekly heart-disease deaths x weather x air pollution, 46 states"
    source: "as us_mortality, cause = diseases of the heart"
    provenance: "REAL"
    files: ["data/processed/us_heart_panel.parquet"]
    design: "continuous"
    stressors: ["heat_index", "pm25", "rh", "o3", "drought_index", "pm10", "no2", "uv", "wind", "precip"]
    outcome: "excess heart-disease mortality in %, same construction"
    status: "INGESTED"

  - id: "us_stroke"
    track: "C"
    title: "US weekly stroke deaths x weather x air pollution, 38 states"
    source: "as us_mortality, cause = cerebrovascular diseases (states where the CDC does not suppress small counts)"
    provenance: "REAL"
    files: ["data/processed/us_stroke_panel.parquet"]
    design: "continuous"
    stressors: ["heat_index", "pm25", "rh", "o3", "drought_index", "pm10", "no2", "uv", "wind", "precip"]
    outcome: "excess stroke mortality in %, same construction"
    status: "INGESTED"

  - id: "india_grid"
    track: "D"
    title: "India daily electricity supplied x state weather, 8 large states, 2019-2024"
    source: "Grid-India (POSOCO) daily energy met per state and state-level ERA5 weather, packaged by Hunt and Bloomfield (Zenodo 10.5281/zenodo.14983362, CC BY 4.0). Built by scripts/build_india_grid_panel.py"
    provenance: "REAL"
    files: ["data/processed/india_grid_panel.parquet", "data/processed/india_grid_panel_qc.json"]
    design: "continuous"
    stressors: ["tmax", "rh", "wind", "solar", "cloud"]
    outcome: "% above the state's own expected electricity supplied (trend, season, weekday); a non-health outcome (grid stress)"
    status: "INGESTED"

  - id: "india_grid_late"
    track: "D"
    title: "India electricity, the 8 states of india_grid, AFTER the analysis window (Apr 2024 to Oct 2026): the data a pair must survive to be replicated on later data"
    source: "Robbie Andrew's daily compilation of Grid-India reports (https://robbieandrew.github.io/india/) and Open-Meteo/ERA5 weather averaged over 3 cities per state. Built by scripts/build_india_grid_late.py"
    provenance: "REAL"
    files: ["data/processed/india_grid_late_panel.parquet", "data/processed/india_grid_late_panel_qc.json"]
    design: "continuous"
    stressors: ["tmax", "rh", "wind", "solar", "cloud"]
    outcome: "same construction as india_grid; an input of the india_grid replication check, not an analysis of its own"
    status: "INGESTED"

  - id: "india_grid_b_late"
    track: "D"
    title: "India electricity, the 8 states of india_grid_b, after the analysis window"
    source: "as india_grid_late"
    provenance: "REAL"
    files: ["data/processed/india_grid_b_late_panel.parquet", "data/processed/india_grid_b_late_panel_qc.json"]
    design: "continuous"
    stressors: ["tmax", "rh", "wind", "solar", "cloud"]
    outcome: "same construction as india_grid"
    status: "INGESTED"

  - id: "india_grid_b"
    track: "D"
    title: "India daily electricity supplied x state weather, 8 other states (a check across states)"
    source: "as india_grid, different states"
    provenance: "REAL"
    files: ["data/processed/india_grid_b_panel.parquet", "data/processed/india_grid_b_panel_qc.json"]
    design: "continuous"
    stressors: ["tmax", "rh", "wind", "solar", "cloud"]
    outcome: "same construction as india_grid"
    status: "INGESTED"