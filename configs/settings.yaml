seeds:
  global: 20260929

alpha: 0.05
fdr_method: "bh"
min_abs_effect: 0.5  # log2 scale: multiplicative fold-change threshold

# Track A configuration
# Expression table variant, chosen on technical grounds (ribosomal-RNA-depleted counts) before any
# discovery result was seen, and applied identically to both studies. Alternative: "Normalized_Counts".
osdr_expression_variant: "rRNArm"
# Independent low-expression filter: keep genes with mean log2 >= 1 and >= 3 samples with log2 >= 1.
# It never uses group labels or any interaction statistic.
expression_filter:
  min_mean_log2: 1.0
  min_log2: 1.0
  min_samples: 3

# Track B / panel discovery. effect_gate is a fraction of the outcome SD (pre-specified, not tuned).
discovery:
  effect_gate: 0.05
  n_boot: 299
  n_ci: 200
  topk_second_opinion: 6

bootstrap_reps: 2000
cv_folds: 5
max_findings_per_run: 50

confidence_weights:
  stat: 0.35
  replication: 0.30
  robustness: 0.20
  trust: 0.15

paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  synthetic_data_dir: "data/synthetic"
  reference_data_dir: "data/reference"
  manifest_path: "data/MANIFEST.json"
  artifacts_dir: "artifacts"
  models_dir: "artifacts/models"
  results_dir: "artifacts/results"
  reports_dir: "artifacts/reports"
  keys_dir: "artifacts/keys"

ledger:
  db: "artifacts/ledger.db"
  key: "artifacts/keys/ledger_ed25519.pem"
